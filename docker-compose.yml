# Local Zabbix sandbox — your development environment.
# Usage:  docker compose up -d
# Web UI: http://localhost:8080  (login: Admin / zabbix)
# API:    http://localhost:8080/api_jsonrpc.php
# Teardown: docker compose down -v   (-v wipes the database)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_sandbox
      POSTGRES_DB: zabbix
    volumes:
      - pgdata:/var/lib/postgresql/data

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:7.0-alpine-latest
    depends_on:
      - postgres
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_sandbox
      POSTGRES_DB: zabbix
    ports:
      - "10051:10051"

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:7.0-alpine-latest
    depends_on:
      - zabbix-server
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: zabbix_sandbox
      POSTGRES_DB: zabbix
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Chicago
    ports:
      - "8080:8080"

  # A fake "fleet member" so the sandbox has something to monitor.
  # Add more of these (agent2, agent3...) to simulate a bigger fleet.
  agent1:
    image: zabbix/zabbix-agent2:7.0-alpine-latest
    depends_on:
      - zabbix-server
    environment:
      ZBX_HOSTNAME: sim-node-01
      ZBX_SERVER_HOST: zabbix-server

volumes:
  pgdata:
