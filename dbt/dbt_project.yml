name: zabbix_telemetry
version: "1.0.0"
config-version: 2

profile: zabbix_telemetry

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  zabbix_telemetry:
    # Everything materialises into one schema (TELEMETRY) with layer
    # prefixes on the model names, rather than separate BRONZE/SILVER/GOLD
    # schemas. The schema is MANAGED ACCESS and owned by DEV_ZABBIX_DBADMIN,
    # so creating new schemas needs a stored procedure and grants we do not
    # control. Prefixes give the same clarity with none of that dependency.
    # See docs/adr/ADR-008.
    +materialized: table
    silver:
      +tags: ["silver"]
    gold:
      +tags: ["gold"]
