# dbt connection profile.
#
# Every value is read from the environment rather than written here, so this
# file is safe to commit and there is exactly one place credentials live:
# the repo's .env. Run dbt through scripts/dbt.py, which loads .env into the
# environment first — plain `dbt run` will not see those values.

zabbix_telemetry:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'TELEMETRY') }}"

      # Key-pair auth, same credential the extractor uses.
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH') }}"
      private_key_passphrase: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PASSPHRASE', '') }}"

      threads: 4
      client_session_keep_alive: false
      query_tag: dbt_zabbix_telemetry
